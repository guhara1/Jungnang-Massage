name: 색인 통보 (IndexNow + Google)

# main 브랜치에 push되면 Cloudflare Pages가 재배포된다. 배포가 반영될 시간을
# 잠깐 둔 뒤, 변경된 사이트의 URL을 IndexNow(빙·네이버·얀덱스)와
# 구글 Indexing API에 통보한다. 수동 실행(workflow_dispatch)도 가능.

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "build.py"
      - "sitemap.xml"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 빌드 (sitemap·rss·IndexNow 키 갱신)
        run: python3 build.py

      - name: 배포 반영 대기
        run: sleep 90

      - name: IndexNow 통보 (빙·네이버·얀덱스)
        run: python3 scripts/indexnow_submit.py

      - name: 구글 Indexing API 통보
        # GOOGLE_SERVICE_ACCOUNT_JSON 시크릿이 설정된 경우에만 실행
        if: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -m pip install -r scripts/requirements.txt
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > /tmp/gsa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gsa.json
          python3 scripts/google_indexing.py
          rm -f /tmp/gsa.json
